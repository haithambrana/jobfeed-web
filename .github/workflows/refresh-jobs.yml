name: refresh-jobs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get jobfeed engine
        run: |
          git clone --depth 1 https://github.com/haithambrana/jobfeed.git ./jobfeed
      - name: Install deps
        run: |
          pip install requests feedparser
      - name: Fetch and export snapshot
        env:
          JOBFEED_PATH: ${{ github.workspace }}/jobfeed
        run: |
          python -m jobfeed.cli fetch
          python export_json.py
      - name: Commit refreshed data
        run: |
          git config user.name "haithambrana"
          git config user.email "88677124+haithambrana@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || { git commit -m "chore: refresh jobs snapshot"; git push; }
